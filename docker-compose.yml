version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: sso_postgres
    env_file: .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - sso_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sso_user -d sso_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth_service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: auth_service
    ports:
      - "${AUTH_SERVICE_PORT}:${AUTH_SERVICE_PORT}"
    env_file: .env
    environment:
      - PORT=${AUTH_SERVICE_PORT}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - JWT_SECRET=${JWT_SECRET}
      - SESSION_SECRET=${SESSION_SECRET}
      - KEYCLOAK_URL=http://keycloak:8090
      - KEYCLOAK_BROWSER_URL=http://localhost:8090
      - KEYCLOAK_REALM=micro-dashboard-sso
      - KEYCLOAK_CLIENT_ID=auth-service
      - KEYCLOAK_CLIENT_SECRET=BC559fCoLdXfV2zbNQY7aVpuP32gEeq8
      - OIDC_ENABLED=true
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - sso_network
    restart: unless-stopped

  profile_service:
    build:
      context: ./profile-service
      dockerfile: Dockerfile
    container_name: profile_service
    ports:
      - "${PROFILE_SERVICE_PORT}:${PROFILE_SERVICE_PORT}"
    env_file: .env
    environment:
      - PORT=${PROFILE_SERVICE_PORT}
      - JWT_SECRET=${JWT_SECRET}
      - SESSION_SECRET=${SESSION_SECRET}
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL}
      - SERVICE_URL=${PROFILE_SERVICE_URL}
    networks:
      - sso_network
    restart: unless-stopped

  billing_service:
    build:
      context: ./billing-service
      dockerfile: Dockerfile
    container_name: billing_service
    ports:
      - "${BILLING_SERVICE_PORT}:${BILLING_SERVICE_PORT}"
    env_file: .env
    environment:
      - PORT=${BILLING_SERVICE_PORT}
      - JWT_SECRET=${JWT_SECRET}
      - SESSION_SECRET=${SESSION_SECRET}
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL}
      - SERVICE_URL=${BILLING_SERVICE_URL}
    networks:
      - sso_network
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    container_name: sso_keycloak
    command: start-dev
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://postgres:5432/sso_db
      - KC_DB_USERNAME=sso_user
      - KC_DB_PASSWORD=sso_password
      - KC_HTTP_PORT=8090
      - KC_HOSTNAME_STRICT=false
      - KC_HOSTNAME_STRICT_HTTPS=false
      - KC_HOSTNAME_URL=http://localhost:8090
      - KC_HOSTNAME_ADMIN_URL=http://localhost:8090
    ports:
      - "8090:8090"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8090 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - sso_network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  sso_network:
    driver: bridge
